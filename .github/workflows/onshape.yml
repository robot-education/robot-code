# Makes the releases main asks for in releases/: each pushes what it releases over Onshape's, as it is on main, then
# versions it (see docs/fs-cli.md#branches). Spends the API allocation of the account whose keys are in the
# ONSHAPE_ACCESS_KEY and ONSHAPE_SECRET_KEY secrets, and pushes what releasing commits to main with the deploy key in
# DEPLOY_KEY (see docs/fs-cli.md#the-onshape-workflow).
name: Onshape

on:
  push:
    branches: [main]
  workflow_dispatch:

# One at a time, so two merges can't both version a document
concurrency:
  group: onshape
  cancel-in-progress: false

permissions:
  # To commit what releases record, and push their tags
  contents: write

jobs:
  onshape:
    # Not for what a run of it pushed (which a deploy key's push starts again): it releases nothing new
    if: github.event.head_commit.author.name != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      API_ACCESS_KEY: ${{ secrets.ONSHAPE_ACCESS_KEY }}
      API_SECRET_KEY: ${{ secrets.ONSHAPE_SECRET_KEY }}
      FS_BRANCH: main
    steps:
      - uses: actions/checkout@v4
        with:
          # fs recognizes Onshape's code in git history
          fetch-depth: 0
          # Pushes with the deploy key in DEPLOY_KEY, which main's ruleset lets bypass its pull requests (the
          # workflow's own token can't be); without it, with the token
          ssh-key: ${{ secrets.DEPLOY_KEY }}
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run pytest -q
      - run: uv run fs check
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Make the releases asked for
        run: uv run fs releases --run
      - name: Push what releasing committed
        run: git push origin HEAD:main
