<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20">
  <g stroke="#333" stroke-width="0.6" stroke-linejoin="round">
    <!-- A short 2x1 tube drawn like std Frame: its profile at the front, extruded back to the upper left -->
    <path d="M11 7 L5 1 L5 13 L11 19 Z" fill="#ddd"/>
    <path d="M11 7 L5 1 L11 1 L17 7 Z" fill="#fff"/>
    <path d="M11 7 H17 V19 H11 Z M12.4 8.4 V17.6 H15.6 V8.4 Z" fill="#999" fill-rule="evenodd"/>
    <!-- Inside it, its right wall and its floor -->
    <path d="M15.6 8.4 V17.6 L12.4 14.4 V8.4 Z" fill="#666"/>
    <path d="M12.4 14.4 L15.6 17.6 H12.4 Z" fill="#ccc"/>
  </g>
  <!-- Two holes stacked in its side, and one in its top: circles in each face's plane -->
  <g fill="#333">
    <circle r="1.5" transform="matrix(-0.7 -0.7 0 1 8 7.5)"/>
    <circle r="1.5" transform="matrix(-0.7 -0.7 0 1 8 12.5)"/>
    <circle r="1.5" transform="matrix(1 0 -0.7 -0.7 11 4)"/>
  </g>
</svg>
