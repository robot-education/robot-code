<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20">
  <g stroke="#333" stroke-width="0.6" stroke-linejoin="round">
    <!-- A short square bar drawn like std Frame: its profile at the front, extruded back to the upper left -->
    <path d="M10 10 L2 2 L2 10 L10 18 Z" fill="#ddd"/>
    <path d="M10 10 L2 2 L10 2 L18 10 Z" fill="#fff"/>
    <path d="M10 10 H18 V18 H10 Z" fill="#999"/>
  </g>
  <!-- A hole in its top and one in its side: circles in each face's plane -->
  <g fill="#333">
    <circle r="1.7" transform="matrix(1 0 -0.7 -0.7 10 6)"/>
    <circle r="1.7" transform="matrix(-0.7 -0.7 0 1 6.5 11)"/>
  </g>
</svg>
