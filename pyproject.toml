[project]
name = "robot-code"
version = "0.1.0"
description = "Source of truth for my Onshape FeatureScripts, plus the tooling to edit, push, and release them."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "markdown-it-py>=3.0",
    "pygls>=2.0",
    "python-dotenv>=1.1.0",
    "requests>=2.32.4",
    "semver>=3.0.4",
]

[project.scripts]
fs = "fs_cli.cli:run"
fs-lsp = "fs_lsp.server:main"

[dependency-groups]
# shapely: for icons (fs_cli/icons.py)
dev = ["pytest>=8.0.0", "shapely>=2.0"]
# For regenerating fs_cli/onshape_ui (see its extract.py)
onshape-ui = ["beautifulsoup4>=4.12", "tinycss2>=1.3"]

[tool.fs]
# Folder the backend document's Feature Studios are mirrored to (Onshape folders become subfolders).
path = "featurescripts"
# The backend document: the source code of every FeatureScript. `fs push`/`fs pull` sync it with `path`.
backend = "https://cad.onshape.com/documents/00dd11dabe44da2db458f898/w/6c20cd994b174cc99668701f"
# The public document `fs release` publishes released FeatureScripts to. Not mirrored locally.
frontend = "https://cad.onshape.com/documents/9cffa92db8b62219498f89af/w/06b332ccabc9d2e0aa0abf88"
# The document `fs release --beta` publishes beta releases to.
frontend_beta = "https://cad.onshape.com/documents/d6d83100b10be7a664fa2c84/w/7517d9bc30a444e88795c529"

[tool.pytest.ini_options]
testpaths = ["tests", "vscode-extension/server/tests"]
python_files = ["*test*.py"]

[tool.hatch.build.targets.wheel]
packages = ["onshape_api", "fs_cli", "fs_eval", "vscode-extension/server/fs_lsp"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
